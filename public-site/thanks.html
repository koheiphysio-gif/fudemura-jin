<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>送信完了｜筆村ジン</title>
  <style>
    :root{--ink:#233033;--paper:#f7f4ed;--rust:#9c4a2e;--line:rgba(35,48,51,.17)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);background:var(--paper);font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    main{width:min(560px,100%);padding:48px 32px;text-align:center;background:#fffdf9;border:1px solid var(--line);border-radius:18px}
    .kicker{margin:0 0 12px;color:var(--rust);font-size:12px;font-weight:700;letter-spacing:.22em}
    h1{margin:0 0 18px;font-family:Georgia,"Yu Mincho",serif;font-size:30px;font-weight:400;letter-spacing:.05em}
    p{margin:0 0 28px;font-size:16px;line-height:1.9}
    a{display:inline-block;padding:14px 24px;color:#fff;background:var(--ink);font-size:14px;font-weight:700;letter-spacing:.1em;text-decoration:none}
    a:hover,a:focus-visible{background:var(--rust)}
  </style>
</head>
<body>
  <main>
    <p class="kicker">THANK YOU</p>
    <h1>送信が完了しました</h1>
    <p>お問い合わせいただき、ありがとうございます。<br>内容を確認のうえ、ご入力のメールアドレスへ<br>折り返しご連絡いたします。</p>
    <a href="/">トップページへ戻る</a>
  </main>
</body>
</html>
